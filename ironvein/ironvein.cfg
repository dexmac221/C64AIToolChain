# Linker config for IRON VEIN
# Code at $080D-$3FFF, VIC bank 1 video RAM at $4000-$7FFF (filled gap,
# initialised at runtime), data at $8000-$9FFF.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__:     type = weak, value = $D000;
}
MEMORY {
    ZP:       file = "",  define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O,                start = $07FF, size = $0002;
    HEADER:   file = %O,  define = yes, start = $0801, size = $000C;
    MAIN:     file = %O,  define = yes, start = $080D, size = $37F3, fill = yes, fillval = $00;
    VIDGAP:   file = %O,  define = yes, start = $4000, size = $4000, fill = yes, fillval = $00;
    HIGH:     file = %O,  define = yes, start = $8000, size = $2000, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = HIGH,     type = ro;
    DATA:     load = HIGH,     type = rw;
    INIT:     load = HIGH,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define = yes;
    BSS:      load = HIGH,     type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
