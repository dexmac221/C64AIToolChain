# DEEP SIGNAL: independent C64 PAL layout, assembled assets load in place.
FEATURES { STARTADDRESS: default = $0801; }
SYMBOLS {
    __LOADADDR__: type = import;
    __EXEHDR__: type = import;
    __STACKSIZE__: type = weak, value = $0800;
    __HIMEM__: type = weak, value = $8000;
}
MEMORY {
    ZP: file = "", define = yes, start = $0002, size = $001A;
    LOADADDR: file = %O, start = $07FF, size = 2;
    HEADER: file = %O, define = yes, start = $0801, size = $000C;
    MAIN: file = %O, define = yes, start = $080D, size = $37F3, fill = yes;
    SCREENS: file = %O, start = $4000, size = $0800, fill = yes;
    FONT: file = %O, start = $4800, size = $0800, fill = yes;
    SPRITES: file = %O, start = $5000, size = $1000, fill = yes;
    DATA: file = %O, define = yes, start = $6000, size = $0800, fill = yes;
    TRACE: file = %O, start = $6800, size = $0800, fill = yes;
    STACKGAP: file = %O, start = $7000, size = $1000, fill = yes;
    WORLD: file = %O, start = $8000, size = $2000, fill = yes;
    BLITTER: file = %O, start = $A000, size = $3000;
}
SEGMENTS {
    ZEROPAGE: load = ZP, type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR: load = HEADER, type = ro;
    STARTUP: load = MAIN, type = ro;
    LOWCODE: load = MAIN, type = ro, optional = yes;
    CODE: load = MAIN, type = ro;
    ONCE: load = MAIN, type = ro, define = yes;
    RODATA: load = DATA, type = ro;
    DATA: load = DATA, type = rw;
    INIT: load = DATA, type = rw;
    BSS: load = DATA, type = bss, define = yes;
    FONT: load = FONT, type = ro;
    SPRITES: load = SPRITES, type = ro;
    WORLD: load = WORLD, type = rw;
    BLITTER: load = BLITTER, type = ro;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__, count = __DESTRUCTOR_COUNT__, segment = RODATA;
    CONDES: type = interruptor, label = __INTERRUPTOR_TABLE__, count = __INTERRUPTOR_COUNT__, segment = RODATA, import = __CALLIRQ__;
}
