# Linker config for FULGOR
#
#   $0801-$3FFF  code
#   $4000-$4FFF  VIC bank 1: two screens ($4400, $4800)
#   $5000-$57FF  charset (font copied from ROM at start, tiles from assetgen)
#   $5800-$7FFF  sprites, pointer 96 upwards
#   $8000-$CFFF  unrolled copy/fill code, level, tables, variables, C stack
#
# The game runs with $01 = $35: no BASIC, no KERNAL, I/O visible.

FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0400;
    __HIMEM__:     type = weak, value = $D000;
}
MEMORY {
    ZP:       file = "",  define = yes, start = $0002, size = $00FE;
    LOADADDR: file = %O,                start = $07FF, size = $0002;
    HEADER:   file = %O,  define = yes, start = $0801, size = $000C;
    MAIN:     file = %O,  define = yes, start = $080D, size = $37F3, fill = yes, fillval = $00;
    VSCR:     file = %O,                start = $4000, size = $1000, fill = yes, fillval = $20;
    VCHR:     file = %O,                start = $5000, size = $0800, fill = yes, fillval = $00;
    VSPR:     file = %O,                start = $5800, size = $2800, fill = yes, fillval = $00;
    HIGH:     file = %O,  define = yes, start = $8000, size = $5000;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,  optional = yes;
    CODE:     load = MAIN,     type = ro;
    ONCE:     load = MAIN,     type = ro,  define = yes;
    CHARSET:  load = VCHR,     type = rw;
    SPRITES:  load = VSPR,     type = rw;
    HICODE:   load = HIGH,     type = rw,  optional = yes;
    TIMING:   load = HIGH,     type = rw,  align = $100;
    LEVEL:    load = HIGH,     type = rw,  align = $100;
    RODATA:   load = HIGH,     type = ro;
    DATA:     load = HIGH,     type = rw;
    INIT:     load = HIGH,     type = rw,  optional = yes;
    BSS:      load = HIGH,     type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
